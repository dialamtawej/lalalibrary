version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lalalibrary-app
    container_name: lalalibrary_app_container
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - lalalibrary-network

  db:
    image: mysql:8.0
    container_name: lalalibrary_db_container
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lalalibrary_db
      MYSQL_ROOT_PASSWORD: "54dd54d"
      MYSQL_USER: diala
      MYSQL_PASSWORD: "123d123d"
    ports:
      - "3306:3306"
    networks:
      - lalalibrary-network

networks:
  lalalibrary-network:
    driver: bridge