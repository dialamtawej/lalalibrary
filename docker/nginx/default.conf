# Nginx يستقبل طلبات HTTP ويمررها إلى PHP-FPM في خدمة app
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    charset utf-8;
    client_max_body_size 30M;

    # الملفات العامة (الأغلفة والصور الشخصية) على القرص public.
    # نستخدم alias بدل "php artisan storage:link" لأن الروابط الرمزية
    # لا تعمل بشكل موثوق داخل مجلدات Windows المشتركة مع Docker.
    location /storage/ {
        alias /var/www/storage/app/public/;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # منع الوصول إلى الملفات المخفية مثل .env و .git
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
